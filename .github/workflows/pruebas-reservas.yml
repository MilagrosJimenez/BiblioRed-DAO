name: Pruebas de reservas y disponibilidad

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/reservas-disponibilidad-integridad]

jobs:
  integridad:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Instalar ReportLab
        run: python -m pip install "reportlab>=4.2,<5"
      - name: Comprobar sintaxis de todos los módulos
        run: python -m compileall -q clases datos servicios interfaces main.py
      - name: Ejecutar pruebas SQLite sin base real
        run: python -m unittest discover -s tests -v
